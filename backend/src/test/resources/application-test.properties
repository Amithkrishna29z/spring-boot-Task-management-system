# Unit/slice tests use in-memory H2 (Postgres mode). Flyway is off here (its migrations are
# for real Postgres) so Hibernate builds the schema. The Testcontainers tests cover migrations.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT + cookie config required by JwtUtils / CookieUtils
app.jwt.secret=test-secret-test-secret-test-secret-0123456789
app.jwt.access-expiration-in-ms=900000
app.jwt.refresh-expiration-in-ms=604800000
app.cookie.secure=false
app.cookie.same-site=Lax

# bump the limit so the suite's repeated logins don't get throttled
rate-limit.auth.capacity=1000
rate-limit.auth.duration-minutes=1
