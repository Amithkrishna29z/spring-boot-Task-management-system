spring.application.name=TaskManager

# Database configuration (use environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging configuration
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.amith.taskmanager=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:WARN}
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_SQL:WARN}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# JWT configuration (USE ENVIRONMENT VARIABLES IN PRODUCTION)
app.jwt.secret=${JWT_SECRET:change-this-to-a-secure-random-key-minimum-32-characters-long-for-hmac-sha256-algorithm}
app.jwt.expiration-in-ms=${JWT_EXPIRATION_MS:86400000}

# Server configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# CORS configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator configuration (health checks)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# Cache configuration
spring.cache.type=caffeine
spring.cache.cache-names=tasks,users,statistics
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=10m

server.port=8080