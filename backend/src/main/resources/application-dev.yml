# Dev profile. Creds come from backend/.env (see .env.example), not hardcoded here.
# The import is optional so CI/containers can pass the same values as env vars instead.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/taskdb}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

app:
  cookie:
    # localhost is http, so a Secure cookie would just get dropped
    secure: false
    # 5173 and 8080 are cross-site in dev; Lax keeps the cookie flowing
    same-site: Lax

logging:
  level:
    com.amith.taskmanager: DEBUG
