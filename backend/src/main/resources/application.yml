spring:
  application:
    name: TaskManager
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate just checks it matches the entities
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  cache:
    type: caffeine
    cache-names: tasks,users,statistics
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=10m

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    context-path: /

# let in-flight requests finish on shutdown (goes with server.shutdown=graceful)
lifecycle:
  timeout-per-shutdown-phase: 30s

app:
  jwt:
    # no default on purpose — supplied per environment (.env / env vars)
    secret: ${JWT_SECRET}
    access-expiration-in-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 minutes
    refresh-expiration-in-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${COOKIE_SAME_SITE:Strict}

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

pagination:
  max:
    size: ${PAGINATION_MAX_SIZE:100}

rate-limit:
  auth:
    capacity: ${RATE_LIMIT_AUTH_CAPACITY:5}
    duration-minutes: ${RATE_LIMIT_AUTH_DURATION_MINUTES:15}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.amith.taskmanager: ${LOGGING_LEVEL_APP:INFO}
    org.springframework.security: ${LOGGING_LEVEL_SECURITY:WARN}
    org.hibernate.SQL: ${LOGGING_LEVEL_SQL:WARN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
