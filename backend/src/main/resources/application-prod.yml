# Prod profile. Every secret comes from the env — no defaults, so it fails fast on
# startup if one is missing. A .env file also works for non-container deploys.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false

app:
  jwt:
    secret: ${JWT_SECRET}
  cookie:
    secure: true
    same-site: Strict

logging:
  level:
    root: INFO
    com.amith.taskmanager: INFO
