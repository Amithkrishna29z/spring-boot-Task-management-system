name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      # Runs unit + MockMvc tests and the Testcontainers PostgreSQL/Flyway integration
      # test (Docker is available on the runner).
      - name: Run backend tests
        working-directory: ./backend
        run: mvn -B clean test

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Check formatting
        working-directory: ./frontend
        run: npm run format:check

      - name: Unit/component tests
        working-directory: ./frontend
        run: npm run test

      - name: Production build
        working-directory: ./frontend
        run: npm run build

      # Fail the build only on high/critical advisories in shipped (prod) dependencies.
      - name: Audit production dependencies
        working-directory: ./frontend
        run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    needs: [frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run smoke E2E tests
        working-directory: ./frontend
        run: npm run test:e2e

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to the Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
        env:
          # Don't reach out to Maven Central to resolve parent/transitive POMs;
          # the shared runner IP gets rate-limited (HTTP 429) and aborts the scan.
          TRIVY_OFFLINE_SCAN: 'true'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # secrets can't be referenced in a job-level `if`, so expose their presence as an output.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has-docker: ${{ steps.check.outputs.has-docker }}
    steps:
      - id: check
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            echo "has-docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-docker=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: [backend-test, frontend-test, e2e, security-scan, check-secrets]
    runs-on: ubuntu-latest
    # Skipped (not failed) until Docker Hub secrets are configured.
    if: github.ref == 'refs/heads/main' && needs.check-secrets.outputs.has-docker == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/taskmanager-backend:latest
          cache-to: type=inline

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/taskmanager-frontend:latest
          cache-to: type=inline
